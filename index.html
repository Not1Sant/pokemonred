<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Red Version</title>
  <style>
    body {
      margin: 0;
      background: #4B0F56;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game {
      width: 90vw;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    h1 {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>Pokémon Red Version</h1>
  <div id="game"></div>

  <script>
    EJS_player = "#game";
    EJS_core = "gb";
    EJS_gameUrl = "game.gb";
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
